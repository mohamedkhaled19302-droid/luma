# Supabase configuration (local development + CLI reference).
# See https://supabase.com/docs/reference/cli/config

project_id = "luma"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[analytics]
enabled = true
port = 54327

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
# Confirmation emails are not required for local development.
email_otp_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions]
enabled = true
verify_jwt = true
include_headers = ["x-luma-mode"]

[functions.ai-planner]
verify_jwt = true