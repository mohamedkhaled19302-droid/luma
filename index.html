<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0918" />
    <!-- Apply the saved (or system) theme before first paint so dark-mode users
         never see a flash of light. This must stay matched with src/lib/brand.ts
         (STORAGE_KEYS.theme, plus the pre-rename key) and src/lib/theme.tsx. -->
    <script>
      ;(function () {
        try {
          var stored = null
          try {
            // Current key first, then the pre-rename keys so returning users keep
            // their theme. src/lib/brand.ts migrates the legacy keys permanently.
            stored = window.localStorage.getItem('luma:theme')
            if (stored === null) stored = window.localStorage.getItem('morrow:theme')
            if (stored === null) stored = window.localStorage.getItem('luma-theme')
          } catch (_e) {
            /* storage unavailable - fall through to system pref */
          }
          var dark = false
          if (stored === 'dark') dark = true
          else if (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            dark = true
          }
          var el = document.documentElement
          if (dark) el.classList.add('dark')
          el.style.colorScheme = dark ? 'dark' : 'light'
        } catch (_e) {
          /* never block rendering over a theme bootstrap failure */
        }
      })()
    </script>
    <meta
      name="description"
      content="LUMA balances your deadlines, habits, energy and sleep into one realistic daily plan. Plan your life. Not just your tasks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LUMA &mdash; Plan your life. Not just your tasks.</title>
  </head>
  <body>
    <div class="theme-body" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
